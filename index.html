<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <!-- Importando fontes elegantes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Forum&family=Cormorant+Garamond:wght@400;500;700&display=swap"
        rel="stylesheet">

    <title>CEREJA VENENOSA</title>

    <style>
        body {
            font-family: 'Cormorant Garamond', serif;
        }

        header ul li a,
        h1, h2, h3, h5 {
            font-family: 'Forum', serif;
            letter-spacing: 1px;
        }

        p, small {
            font-family: 'Cormorant Garamond', serif;
        }

        /* Seção de produtos apenas com imagens grandes */
        #produtos {
            display: flex;
            flex-direction: column; /* empilha verticalmente */
            align-items: center;
            gap: 40px;
            margin-top: 40px;
        }

        .card-grande {
            width: 100%; /* ocupa toda a largura */
            max-width: 1200px; /* limite opcional */
            box-shadow: rgba(0,0,0,0.25) 0px 4px 8px;
            border-radius: 8px;
            overflow: hidden;
        }

        .card-grande img {
            width: 100%;
            height: auto; /* mantém proporção original */
            display: block;
        }

        /* Rodapé */
        footer {
            background-color: #1a1a1a; /* fundo escuro */
            color: #f4e9d8; /* bege clarinho */
        }

        footer a {
            color: #f4e9d8 !important;
            transition: 0.3s;
        }

        footer a:hover {
            color: #a32040 !important; /* cereja ao passar o mouse */
        }

        footer p {
            color: #f4e9d8;
        }
    </style>
</head>

<body>
    <div id="root">
        <header>
            <div id="logo">
                <img src="./images/logo-bar.jpeg" alt="Logo do Cardápio">
            </div>
            <div>
                <ul>
                    <li><a href="#sobre">Sobre</a></li>
                    <li><a href="#produtos">Produtos</a></li>
                    <li><a href="#contato">Contato</a></li>
                </ul>
            </div>
        </header>
        <main>
            <div id="central">
                <section id="marketing">
                    <div>
                        <p>
                            Aqui a <b>noite</b> sussurra segredos,<br>
                            a <b>cereja</b> guarda um veneno sedutor,<br>
                            os copos brilham como <b>feitiços</b> proibidos,<br>
                            e cada gole revela um <b>mistério</b> oculto.
                        </p>
                    </div>
                    <div id="hamburguer">
                        <a>
                            <img src="./images/logo-maior.png" alt="Logo maior">
                        </a>
                    </div>
                </section>

                <!-- Seção de produtos apenas com imagens no tamanho original -->
                <section id="produtos">
                    <div class="card-grande">
                        <img src="./images/cardapio1.jpg" alt="Cardápio Parte 1">
                    </div>

                    <div class="card-grande">
                        <img src="./images/cardapio2.jpg" alt="Cardápio Parte 2">
                    </div>

                    <div class="card-grande">
                        <img src="./images/cardapio3.jpg" alt="Cardápio Parte 3">
                    </div>

                    <div class="card-grande">
                        <img src="./images/cardapio4.jpg" alt="Cardápio Parte 4">
                    </div>

                    <div class="card-grande">
                        <img src="./images/cardapio5.jpg" alt="Cardápio Parte 5">
                    </div>
                </section>
            </div>
        </main>
        <footer>
            <div class="container">
                <footer class="py-3 my-4">
                  <ul class="nav justify-content-center border-bottom pb-3 mb-3">
                    <li class="nav-item"><a href="#" class="nav-link px-2">Contato</a></li>
                    <li class="nav-item"><a href="#" class="nav-link px-2">Sugestões</a></li>
                    <li class="nav-item"><a href="#" class="nav-link px-2">Trabalhe Conosco</a></li>
                    <li class="nav-item"><a href="#" class="nav-link px-2">FAQs</a></li>
                    <li class="nav-item"><a href="#" class="nav-link px-2">Sobre</a></li>
                  </ul>
                  <p class="text-center">&copy; 2026 CEREJA VENENOSA</p>
                </footer>
              </div>
        </footer>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"></script>
    </div>
</body>

</html>
